[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glitters_geospatial_engine"
version = "1.1.0"
description = "Computational Geospatial Intelligence, Remote Sensing, and Spatial Indexing Engine for GLITTERS (Kenya)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - GLITTERS Spatial Intelligence Ecosystem"}
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "geopandas>=1.0.0",
]

[project.optional-dependencies]
raster = ["rasterio>=1.3.0", "xarray>=2024.1.0", "dask>=2024.1.0"]
ml = ["torch>=2.2.0", "scikit-learn>=1.4.0"]
db = ["psycopg[binary]>=3.1.0", "duckdb>=1.0.0"]
dggs = ["h3>=3.7.0", "s2sphere>=0.2.5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["glitters_geospatial_engine*"]
exclude = ["tests*", "benchmarks*", "sql*"]

[tool.setuptools.package-data]
"glitters_geospatial_engine.datasets" = ["*.geojson"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
