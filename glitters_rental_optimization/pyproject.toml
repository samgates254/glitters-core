[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glitters-rental-optimization"
version = "2.0.0"
description = "GLITTERS Rental Pricing & Revenue Optimization Engine: Causal IV-DML, Weibull Survival Hazard, DTMC Occupancy, and SLSQP Portfolio Nonlinear Programming."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - GLITTERS Algorithmic Platform"}
authors = [
    {name = "GLITTERS Algorithmic Quantitative Economics & Pricing Engineering"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["glitters_rental_optimization*"]
