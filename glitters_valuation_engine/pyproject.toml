[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glitters-valuation-engine"
version = "1.1.0"
description = "GLITTERS Property Valuation Intelligence Engine — Phase 1: Evidence Integrity & Statistical Correctness"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - GLITTERS Real Estate Intelligence"}
authors = [
    {name = "GLITTERS Quantitative Research & Engineering"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["glitters_valuation_engine*"]
