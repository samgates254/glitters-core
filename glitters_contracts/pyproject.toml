[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glitters-contracts"
version = "1.0.0"
description = "Universal Execution, Decision, and Cross-Engine Interoperability Contracts for GLITTERS Algorithmic Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - GLITTERS Algorithmic Platform"}
authors = [
    {name = "GLITTERS Architecture & Systems Verification"}
]
dependencies = [
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["glitters_contracts*"]
