[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glitters_allocation"
version = "1.0.0"
description = "Deterministic, Explainable, Constraint-Driven Property Allocation & Optimization Engine for GLITTERS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "ortools>=9.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["glitters_allocation*"]
